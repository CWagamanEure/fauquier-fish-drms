ServerName localhost
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>
# The development checkout contains configuration and SQL, not just public assets.
<DirectoryMatch "^/var/www/html/(\.git|\.local|docker|sql)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(sql|py|pyc|ya?ml|ini)$|^Dockerfile$)">
    Require all denied
</FilesMatch>
# Keep generated and uploaded files behind the PHP download access checks.
# Mirror the per-directory .htaccess rules for Docker's AllowOverride None.
<DirectoryMatch "^/var/www/html/(uploads|python/exports)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /var/www/html/reportGeneration/reports>
    Require all denied
    <Files "delHandler.php">
        Require all granted
    </Files>
</Directory>
