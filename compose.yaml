name: fauquier-fish-drms
services:
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-fishdb}
      DB_USER: ${DB_USER:-fishdb}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - .:/var/www/html
      - php-sessions:/var/lib/php/sessions
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-fishdb}
      MARIADB_USER: ${DB_USER:-fishdb}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
      - type: bind
        source: ${DB_SEED_FILE:-./sql/casadb.sql}
        target: /docker-entrypoint-initdb.d/001-seed.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  db-data:
  php-sessions:
